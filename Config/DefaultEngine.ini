[ConsoleVariables]
; IncrediBuild/XGE is installed but its license is not activated ("This build will run in
; standalone mode"), so it gives no speedup. During a cook the XGE controller spawns tasks on
; the local machine (AvoidUsingLocalMachine is bypassed for commandlets) and trips a handled
; ensure in XGEController -- "Ensure condition failed: GetShadowIndex() == 0". That error makes
; UnrealEditor-Cmd exit with code 1, so UAT reports "Cook failed" even though the cook itself
; completed every package. Falling back to local shader workers avoids it.
r.XGEController.Enabled=0

